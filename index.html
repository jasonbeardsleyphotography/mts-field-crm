<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090b10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Solid status bar: the app starts BELOW it, so there is nothing under the
         bar for iOS 26.1+ to blur (with "black-translucent" it blurs the top
         ~40pt of the app, header buttons included, and nothing turns that off).
         iOS applies this when the app is added to the Home Screen, so an
         existing install must be removed and re-added once. Until then the
         screens still fill whatever space iOS gives them (they're position:
         fixed, not 100dvh) and every gap is dark. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="MTS Field Sales" />
    <title>MTS Field Sales</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Preconnect to Google domains so first requests don't pay DNS + TLS cold-start -->
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts — one load here, not on every React render -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { background: #090b10; height: 100%; }
      /* Never let iOS enlarge text by itself. This used to be set only in
         landscape, so after the phone rotated (e.g. in the camera) iOS could
         "auto-size" text in portrait and whole screens came back zoomed. */
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      /* Top inset for every header and full-screen panel (the status bar
         height on iPhone; 0 elsewhere). Kept as one variable on purpose. */
      :root { --safe-top: env(safe-area-inset-top, 0px); }
    </style>

    <!-- Load GSI early but non-blocking -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <!-- Static dark splash — painted immediately before any JS runs so iOS
         dismisses its native white splash overlay into a dark screen rather
         than a blank white one. React replaces this on first render. -->
    <div id="root"><div style="position:fixed;inset:0;background:#090b10;display:flex;align-items:center;justify-content:center;"><div style="font-family:system-ui,sans-serif;font-size:13px;font-weight:600;color:#3a4a60;letter-spacing:1px">MTS FIELD SALES</div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
