<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090b10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MTS Field Sales" />
    <title>MTS Field Sales</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Preconnect to Google domains so first requests don't pay DNS + TLS cold-start -->
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts — one load here, not on every React render -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Top inset for every header and full-screen panel. Since iOS 26.1 the
         iPhone draws a dark blur over roughly the top 40pt of a Home Screen web
         app (it can't be switched off), so there the app keeps its controls
         below that band and leaves only plain background inside it. Safari tabs,
         desktop and landscape (no status bar) are unaffected. */
      :root { --safe-top: env(safe-area-inset-top, 0px); }
      @media (orientation: portrait) {
        html.ios-home-app { --safe-top: calc(env(safe-area-inset-top, 0px) + 40px); }
      }
      #mts-top-band { display: none; }
      html.ios-home-app #mts-top-band {
        display: block; position: fixed; top: 0; left: 0; right: 0;
        height: var(--safe-top); background: #0d0f18; z-index: 150; pointer-events: none;
      }
      body { background: #090b10; overflow: hidden; }
      @media screen and (orientation: landscape) {
        html { -webkit-text-size-adjust: 100%; }
      }
    </style>

    <script>
      // iPhone/iPad Home Screen app only (navigator.standalone is iOS-specific).
      if (window.navigator.standalone === true) document.documentElement.classList.add("ios-home-app");
    </script>

    <!-- Load GSI early but non-blocking -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="mts-top-band" aria-hidden="true"></div>
    <!-- Static dark splash — painted immediately before any JS runs so iOS
         dismisses its native white splash overlay into a dark screen rather
         than a blank white one. React replaces this on first render. -->
    <div id="root"><div style="height:100dvh;background:#090b10;display:flex;align-items:center;justify-content:center;"><div style="font-family:system-ui,sans-serif;font-size:13px;font-weight:600;color:#3a4a60;letter-spacing:1px">MTS FIELD SALES</div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
