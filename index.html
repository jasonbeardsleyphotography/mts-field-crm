<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090b10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- Opaque status bar: the page starts below it. Since iOS 26.1 a
         "black-translucent" bar makes iOS blur the top ~40pt of the app (the
         header buttons), with no way to turn that off. Installed apps read
         this at install time — remove and re-add the Home Screen icon. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="MTS Field Sales" />
    <title>MTS Field Sales</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Preconnect to Google domains so first requests don't pay DNS + TLS cold-start -->
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts — one load here, not on every React render -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=DM+Sans:wght@400;500;600&display=swap" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      /* Top inset for every header and full-screen panel. The status bar is
         opaque ("black", below), so on iPhone the page starts underneath it and
         this is 0 — no space is given up. Kept as one variable so the inset can
         be tuned in one place. */
      :root { --safe-top: env(safe-area-inset-top, 0px); }
    </style>

    <!-- Load GSI early but non-blocking -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <!-- Static dark splash — painted immediately before any JS runs so iOS
         dismisses its native white splash overlay into a dark screen rather
         than a blank white one. React replaces this on first render. -->
    <div id="root"><div style="height:100dvh;background:#090b10;display:flex;align-items:center;justify-content:center;"><div style="font-family:system-ui,sans-serif;font-size:13px;font-weight:600;color:#3a4a60;letter-spacing:1px">MTS FIELD SALES</div></div></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
